<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hihi 😽</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/index2.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

</head>

<body class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-pink-200 to-yellow-200">
    <!-- Section-1 -->
    <section class="text-center max-w-4xl mx-auto px-4">
        <h2 class="text-3xl md:text-4xl font-semibold text-pink-600 mt-10">Nói tớ nghe nha, mượn bao nhiêu vậy? 😽</h2>

        <div class="mt-10 bg-white p-8 rounded-2xl shadow-lg bouncy-form">
            <input type="text" placeholder="Tên bạn là gì nè?"
                class="w-full p-4 mb-4 text-gray-800 bg-pink-50 border border-pink-300 rounded-full focus:outline-none focus:border-pink-500">
            <input type="number" placeholder="Mượn bao nhiêu VND nha?"
                class="w-full p-4 mb-4 text-gray-800 bg-pink-50 border border-pink-300 rounded-full focus:outline-none focus:border-pink-500">
            <button class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 px-8 rounded-full bouncy-button">NHẤN
                ĐỂ TIẾP
                TỤC NÈ! 😺</button>
        </div>
    </section>

    <!-- Section-2 -->
    <section class="text-center max-w-4xl mx-auto px-4 mt-16">
        <p class="text-lg md:text-xl mt-4 text-gray-700">Nhắn tớ liền để trả nè, hổng có gì to tát đâu! 😸</p>
        <div class="mt-10">
            <a href="#contact"
                class="bg-yellow-400 hover:bg-yellow-500 text-gray-800 font-bold py-4 px-8 rounded-full bouncy-button">NHẮN
                TỚ LIỀN! 🌟</a>
        </div>
    </section>

    <script>
        const button = document.querySelector('button');
        const form = document.querySelector('.bouncy-form');
        button.addEventListener('click', () => {
            const name = document.querySelector('input[type="text"]').value;
            const amount = document.querySelector('input[type="number"]').value;
            if (!name || !amount) {
                form.style.animation = 'shake 0.4s';
                setTimeout(() => form.style.animation = '', 400);
                alert("Hihi, điền đủ nha bạn ơi! 😹");
            } else {
                alert(
                    `Hê hê, ${name}! Mượn ${amount.toLocaleString('vi-VN')} VND hả? `
                );
                window.location.href = 'index3.html';
            }
        });
    </script>
</body>

</html>
