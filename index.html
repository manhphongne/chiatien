<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hihi 😺</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom right, #fce7f3, #fefcbf);
            color: #1f2937;
            font-family: 'Quicksand', sans-serif;
        }

        .bouncy-text {
            text-shadow: 2px 2px 5px rgba(255, 105, 180, 0.5);
            animation: bounce-text 2s infinite;
        }

        .bouncy-button {
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .bouncy-button:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        @keyframes bounce-text {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px) rotate(10deg);
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-pink-200 to-yellow-200">
    <!-- Header -->
    <header class="text-center py-12">
        <h1 class="text-5xl md:text-7xl font-bold insanlar-text">HÊY, ĂN XONG RỒI, CHIA TIỀN NÀO 😺</h1>
        <p class="text-xl md:text-2xl mt-4 text-gray-800">Nói thiệt nè, tớ chỉ nhắc vui thôi nha! 🌟</p>
    </header>

    <!-- Section-1 -->
    <section class="text-center max-w-4xl mx-auto px-4">
        <h2 class="text-3xl md:text-4xl font-semibold text-pink-600 mt-10">Chọn đi nè, nhanh lên! 🐾</h2>
        <div class="mt-10 flex justify-center space-x-10">
            <button id="debtConfirmationButton"
                class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 px-10 rounded-full bouncy-button">Ừa,
                đợi xíu! 😽</button>
            <button id="sayNo"
                class="bg-yellow-400 hover:bg-yellow-500 text-gray-800 font-bold py-4 px-10 rounded-full bouncy-button">Hổng
                trả đâu! 😸</button>
        </div>
    </section>

    <!-- Footer -->
    <footer class="mt-16 py-6 text-center">
        <p class="text-gray-700">© 2025 - Hỏi vui tí thôi nè! 🐱</p>
    </footer>

    <script>
        const sayNo = document.getElementById('sayNo');
        const debtConfirmationButton = document.getElementById('debtConfirmationButton');
        let scaleFactor = 1; // Track the size increase for debtConfirmationButton

        sayNo.addEventListener('click', () => {
            // Updated behavior: No random repositioning, only text change and bounce animation
            sayNo.style.animation = 'bounce 0.4s';
            sayNo.textContent = "Thiệt hông nè? 😹";

            // Existing behavior: Increase size and change text of debtConfirmationButton
            scaleFactor += 0.2; // Increase size by 20% each click
            debtConfirmationButton.style.transform = `scale(${scaleFactor})`;
            debtConfirmationButton.textContent = "Thiệt hông nè? 😹";
        });

        debtConfirmationButton.addEventListener('click', () => {
            window.location.href = 'index3.html';
        });
    </script>
</body>

</html>
